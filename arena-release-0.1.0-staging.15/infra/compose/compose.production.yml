name: arena-core

x-app: &app
  restart: unless-stopped
  read_only: true
  user: '10001:10001'
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  stop_grace_period: 20s
  tmpfs: [/tmp:rw, noexec, nosuid, size=64m]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

x-build: &build
  context: ../..
  dockerfile: docker/Dockerfile
  args:
    BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
    RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}

services:
  arena-migrate:
    <<: *app
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/arena-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    build: { <<: *build, target: migrate }
    restart: 'no'
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    cpus: ${MIGRATE_CPU_LIMIT:-1.0}

  arena-api:
    <<: *app
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/arena-api:${IMAGE_TAG:?IMAGE_TAG is required}
    build: { <<: *build, target: api }
    depends_on:
      arena-migrate: { condition: service_completed_successfully }
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_ENABLED: 'true'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      MIGRATION_MODE: external
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
    ports: ['127.0.0.1:${API_PORT:-3001}:3001']
    mem_limit: ${API_MEMORY_LIMIT:-512m}
    cpus: ${API_CPU_LIMIT:-1.0}

  arena-worker:
    <<: *app
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/arena-worker:${IMAGE_TAG:?IMAGE_TAG is required}
    build: { <<: *build, target: worker }
    depends_on:
      arena-migrate: { condition: service_completed_successfully }
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_ENABLED: 'true'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
      MIGRATION_MODE: external
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
    mem_limit: ${WORKER_MEMORY_LIMIT:-384m}
    cpus: ${WORKER_CPU_LIMIT:-0.75}

  arena-web:
    <<: *app
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/arena-web:${IMAGE_TAG:?IMAGE_TAG is required}
    build: { <<: *build, target: web }
    environment:
      APP_ENV: production
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m
    mem_limit: ${WEB_MEMORY_LIMIT:-512m}
    cpus: ${WEB_CPU_LIMIT:-1.0}

  arena-seed:
    <<: *app
    profiles: [seed]
    image: ${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/arena-seed:${IMAGE_TAG:?IMAGE_TAG is required}
    build: { <<: *build, target: seed }
    restart: 'no'
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
    mem_limit: 512m
    cpus: 1.0
