name: arena
x-app: &app
  restart: unless-stopped
  read_only: true
  user: '10001:10001'
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  env_file:
    - '${ARENA_ENV_FILE:?ARENA_ENV_FILE required}'
  networks: [app, data]
  logging: &logs { driver: json-file, options: { max-size: 10m, max-file: '3' } }
services:
  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logs
  arena-migrate:
    <<: *app
    image: ${ARENA_MIGRATE_IMAGE:?ARENA_MIGRATE_IMAGE required}
    restart: 'no'
    depends_on: { postgres: { condition: service_healthy } }
  arena-api:
    <<: *app
    image: ${ARENA_API_IMAGE:?ARENA_API_IMAGE required}
    ports: ['127.0.0.1:3001:3001']
    networks: [ingress, app, data]
    healthcheck:
      {
        test: [CMD, node, /healthchecks/http.mjs, http://127.0.0.1:3001/api/v1/health],
        interval: 10s,
        timeout: 3s,
        retries: 12,
      }
  arena-worker:
    <<: *app
    image: ${ARENA_WORKER_IMAGE:?ARENA_WORKER_IMAGE required}
  arena-web:
    <<: *app
    image: ${ARENA_WEB_IMAGE:?ARENA_WEB_IMAGE required}
    ports: ['127.0.0.1:3000:3000']
    networks: [ingress, app]
  arena-seed:
    <<: *app
    profiles: [seed]
    image: ${ARENA_SEED_IMAGE:-arena-seed:disabled}
    restart: 'no'
networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
  app: { internal: true }
  data: { internal: true }
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: '${ARENA_SECRETS_DIR:?ARENA_SECRETS_DIR required}/POSTGRES_PASSWORD'
