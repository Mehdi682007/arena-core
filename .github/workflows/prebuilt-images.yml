name: Build prebuilt deployment images
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable Arena release ID
        required: true
      image_tag:
        description: Immutable image tag (normally the full commit SHA)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push five targets sequentially
        env:
          ARENA_REGISTRY: ghcr.io/${{ github.repository_owner }}
          ARENA_IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_MANIFEST_OUTPUT: deployment-images.json
        run: bash scripts/release/build-prebuilt-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-images-${{ inputs.release_id }}
          path: deployment-images.json
          if-no-files-found: error
