name: Release artifact verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      DATABASE_DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm before cache discovery
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: ShellCheck production deployment scripts
        run: |
          shellcheck -x --exclude=SC1091 \
            infra/scripts/backup.sh \
            infra/scripts/deploy.sh \
            infra/scripts/install-release.sh \
            infra/scripts/validate-external-db-egress-runtime.sh \
            infra/scripts/lib/backup-permissions.sh \
            infra/scripts/lib/images.sh \
            infra/scripts/monitor.sh \
            infra/scripts/restore.sh \
            infra/scripts/verify.sh \
            scripts/release/validate-backup-runtime.sh
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm release:preflight
      - name: Generate deterministic release fixture
        shell: bash
        run: |
          cp release/deployment-images.example.json release/deployment-images.json
          rm -f release/manifest.ci.json

          RELEASE_VERSION=0.1.0-staging.1 \
          BUILD_SHA=0123456789abcdef0123456789abcdef01234567 \
          SOURCE_DATE_EPOCH=1785283200 \
          node scripts/release/generate-manifest.mjs release/manifest.ci.json

      - name: Verify release fixture
        run: node scripts/release/verify-artifacts.mjs release/manifest.ci.json
  container-build:
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      matrix:
        target: [api, worker, web, migrate, seed]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: arena-${{ matrix.target }}:ci-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            RELEASE_VERSION=0.0.0-ci
  ingress-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate loopback ingress publication and isolation
        run: sudo bash infra/scripts/validate-ingress-runtime.sh
  external-db-egress-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded host access from database clients
        run: sudo bash infra/scripts/validate-external-db-egress-runtime.sh
  backup-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate extracted tracked prebuilt backup path
        run: |
          git archive --format=tar --output=/tmp/arena-source.tar "$GITHUB_SHA"
          mkdir /tmp/arena-source
          tar -xf /tmp/arena-source.tar -C /tmp/arena-source
          cd /tmp/arena-source
          sudo bash scripts/release/validate-backup-runtime.sh
  seed-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build migration and Seed images
        run: |
          docker build --file docker/Dockerfile --target migrate --tag arena-migrate:seed-ci .
          docker build --file docker/Dockerfile --target seed --tag arena-seed:seed-ci .
      - name: Validate tracked Compose Seed container contract
        run: bash scripts/release/validate-seed-compose-runtime.sh arena-seed:seed-ci
      - name: Validate offline and disposable-database Seed runtime
        run: bash scripts/release/validate-seed-image.sh arena-seed:seed-ci arena-migrate:seed-ci
