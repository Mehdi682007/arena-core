name: Release artifact verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      DATABASE_DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm before cache discovery
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm release:preflight
      - run: pnpm release:verify
  container-build:
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      matrix:
        target: [api, worker, web, migrate, seed]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: arena-${{ matrix.target }}:ci-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            RELEASE_VERSION=0.0.0-ci
  ingress-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Validate loopback ingress publication and isolation
        run: sudo bash infra/scripts/validate-ingress-runtime.sh
  seed-runtime:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build migration and Seed images
        run: |
          docker build --file docker/Dockerfile --target migrate --tag arena-migrate:seed-ci .
          docker build --file docker/Dockerfile --target seed --tag arena-seed:seed-ci .
      - name: Validate tracked Compose Seed container contract
        run: bash scripts/release/validate-seed-compose-runtime.sh arena-seed:seed-ci
      - name: Validate offline and disposable-database Seed runtime
        run: bash scripts/release/validate-seed-image.sh arena-seed:seed-ci arena-migrate:seed-ci
