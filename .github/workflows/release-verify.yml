name: Release artifact verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned pnpm before cache discovery
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - run: pnpm release:preflight
      - run: pnpm release:verify
  container-build:
    runs-on: ubuntu-24.04
    needs: quality
    strategy:
      matrix:
        target: [api, worker, web, migrate, seed]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: false
          tags: arena-${{ matrix.target }}:ci-${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            RELEASE_VERSION=0.0.0-ci
